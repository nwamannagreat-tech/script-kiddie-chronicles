<!DOCTYPE html>
<html>
<head>
    <title>FUTURE Scent Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title">FUTURE – Interactive Scent Gallery</h1>

<div class="gallery">

    <div class="scent-card">
        <div class="card-inner">
            <div class="card-front">
                <img src="https://via.placeholder.com/200x250" alt="Scent 1">
                <h3>Midnight Flame</h3>
            </div>
            <div class="card-back">
                <h3>Midnight Flame</h3>
                <p>Notes: Vanilla, Amber, Musk</p>
                <p class="price">$79</p>
                <button onclick="shopNow('Midnight Flame')">Shop Now</button>
            </div>
        </div>
    </div>

    <div class="scent-card">
        <div class="card-inner">
            <div class="card-front">
                <img src="https://via.placeholder.com/200x250" alt="Scent 2">
                <h3>Ocean Drift</h3>
            </div>
            <div class="card-back">
                <h3>Ocean Drift</h3>
                <p>Notes: Citrus, Sea Salt, Cedarwood</p>
                <p class="price">$65</p>
                <button onclick="shopNow('Ocean Drift')">Shop Now</button>
            </div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
